<!-- Mobile sidebar toggle button (≤1024px) — mirrors the recipe details sidebar -->
<button
  type="button"
  class="sidebar-toggle-btn"
  (click)="onToggleMobile()"
  [attr.aria-expanded]="mobileOpen"
  aria-label="Toggle function navigation">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<div class="sidebar-backdrop" *ngIf="mobileOpen" (click)="onCloseMobile()"></div>

<div
  class="sidebar-wrapper"
  [class.collapsed]="collapsed$ | async"
  [class.show-sidebar]="mobileOpen"
>
  <aside
    class="sidebar"
    [class.collapsed]="(collapsed$ | async) && !mobileOpen"
  >
    <div class="sidebar-scroll-content">
      <app-navigation
        [collapsed$]="collapsed$"
        (toggleSidebar)="onToggleSidebar()"
        (linkClick)="onCloseMobile()">
      </app-navigation>
    </div>
  </aside>

  <!-- Floating button for collapsed state -->
  <button
    class="sidebar-collapse-button"
    *ngIf="collapsed$ | async"
    (click)="onToggleSidebar()"
    title="Expand Sidebar"
  >
    <span>☰</span>
  </button>
</div>
