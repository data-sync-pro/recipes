<div class="container app-transformation">
  <!-- Sidebar Component -->
  <app-sidebar
    [collapsed$]="collapsed$"
    [mobileOpen]="mobileOpen"
    [class.collapsed]="collapsed$ | async"
    (toggleSidebar)="onToggleSidebar()"
    (toggleMobile)="toggleMobile()"
    (closeMobile)="closeMobile()">
  </app-sidebar>

  <main class="content" [class.sidebar-collapsed]="collapsed$ | async">
    <router-outlet></router-outlet>
  </main>
</div>
