<div class="recipe-list">
    <!-- Landing title — mirrors the FAQ "All FAQs" page heading and the recipe
         detail-banner title (2.25rem, weight 500, brand blue, centered). Hidden
         while searching, matching the FAQ page-title behavior. -->
    <h1 class="recipe-page-title" *ngIf="!searchQuery.trim()">All Recipes</h1>

    <!-- Flat title-only list, matching the FAQ "All FAQs" list rows. -->
    <div class="result-list">
        <a *ngFor="let recipe of recipes; trackBy: trackByRecipeId"
            class="recipe-row"
            [routerLink]="recipeLink(recipe)"
            (click)="onRecipeClick(recipe)">
            <h3 class="recipe-row-title">{{ recipe.title }}</h3>
        </a>

        <!-- Empty State -->
        <div *ngIf="recipes.length === 0" class="empty-state">
            <mat-icon>search_off</mat-icon>
            <p>No recipes found</p>
        </div>
    </div>
</div>
